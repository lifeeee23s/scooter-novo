    /* ===== MODAL "RESGATE SEU PRÊMIO" (100% IDÊNTICO AO MOBILE TIKTOK.PEDIDO.INFO) ===== */
    #reward-root {
      visibility: hidden;
      pointer-events: none;
    }

    #reward-root.is-open,
    #reward-root.is-closing {
      visibility: visible;
      pointer-events: auto;
    }

    #reward-root .reward-overlay {
      position: fixed;
      inset: 0;
      background: #16182375;
      z-index: 10000;
      opacity: 0;
      will-change: opacity;
    }

    #reward-root .reward-sheet {
      position: fixed;
      z-index: 10001;
      left: 50%;
      bottom: 0;
      transform: translate(-50%, 100%);
      width: min(100vw, 520px);
      min-height: min(94dvh, 790px);
      max-height: min(96dvh, 800px);
      overflow-y: auto;
      overscroll-behavior: contain;
      background: #fff;
      color: #161823;
      border-radius: 24px 24px 0 0;
      padding: 26px 22px calc(20px + env(safe-area-inset-bottom, 0px));
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 -12px 48px #16182333;
      will-change: transform;
    }

    #reward-root.is-open .reward-overlay {
      animation: fadeOverlay .22s ease-out forwards;
    }

    #reward-root.is-open .reward-sheet {
      animation: sheetSlideUp .43s cubic-bezier(.2, .82, .22, 1) forwards;
    }

    #reward-root.is-closing .reward-overlay {
      animation: fadeOverlayOut .18s ease-in forwards;
    }

    #reward-root.is-closing .reward-sheet {
      animation: sheetSlideDown .3s cubic-bezier(.4, 0, 1, 1) forwards;
    }

    @keyframes fadeOverlay {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    @keyframes fadeOverlayOut {
      from {
        opacity: 1;
      }

      to {
        opacity: 0;
      }
    }

    @keyframes sheetSlideUp {
      from {
        transform: translate(-50%, 100%);
      }

      to {
        transform: translate(-50%, 0);
      }
    }

    @keyframes sheetSlideDown {
      from {
        transform: translate(-50%, 0);
      }

      to {
        transform: translate(-50%, 100%);
      }
    }

    try { sessionStorage.setItem('gts_reward_deadline', String(activeRewardDeadline)); } catch (e) { }

    const initialQty = Math.min(MAX_QTY, Math.max(1, parseInt(sessionStorage.getItem('gts_qty') || '1', 10) || 1));

    const state = {
      view: initialView,
      slide: 0,
      variant: sessionStorage.getItem('gts_variant') === 'Preto' ? 'Preto' : 'Branco',

      lightboxIdx: null,
      followingStore: false,
      descOpen: true,
      cepLoading: false,

      submitting: false,

    const app = document.getElementById('app');

    // Cálculo fiel à função Ug() da referência (10% OFF acima de R$ 39, teto de R$ 30)
    function couponDiscountCents() {
      if (!state.couponApplied) return 0;
      const subCents = Math.round(BASE_UNIT_PRICE * 100) * state.qty;
      if (subCents < 3900) return 0;
      return Math.min(3000, Math.round(subCents * 0.10));
    }

    function effectiveUnitPrice() {
      if (!state.couponApplied) return BASE_UNIT_PRICE;
      const totalAfter = (Math.round(BASE_UNIT_PRICE * 100) * state.qty - couponDiscountCents()) / 100;
      return Number((totalAfter / state.qty).toFixed(2));
    }

    function productSubtotal() {
      return (Math.round(BASE_UNIT_PRICE * 100) * state.qty - couponDiscountCents()) / 100;
    }

    function selectedTotal() {
      return [...state.selected].reduce((sum, id) => sum + (BUMPS.find(x => x.id === id)?.price || 0), 0);
    }

    function total() {
      return Number((productSubtotal() + selectedTotal()).toFixed(2));
    }

    function totalSavings() {
      return Number((ORIG_UNIT_PRICE * state.qty - productSubtotal()).toFixed(2));
    }

    function persistCartSnapshot() {
      try {
        sessionStorage.setItem('gts_variant', state.variant);
        sessionStorage.setItem('gts_qty', String(state.qty));
        sessionStorage.setItem('gts_coupon_10_applied', state.couponApplied ? '1' : '0');
        sessionStorage.setItem('from_gts_funnel', '1');
        saveSelectedBumps(state.selected);
        const variantImg = state.variant === 'Branco' ? '/tkk-pedido/oferta-assets/produto-2.webp' : '/tkk-pedido/oferta-assets/produto-3.webp';
        const unitNow = effectiveUnitPrice();
        const mainItem = {
          id: PRODUCT_ID,
          nome: PRODUCT_NAME,
          preco: unitNow,
          precoOriginal: ORIG_UNIT_PRICE,
          img: variantImg,
          qty: state.qty,
          variacao: 'Cor: ' + state.variant,
          selected: true
        };
        const allItems = [mainItem];
        state.selected.forEach(id => {
          const b = BUMPS.find(x => x.id === id);
          if (b) {
            allItems.push({
              id: b.itemId,
              nome: b.name,
              preco: b.price,
              img: b.image,
              qty: 1,
              variacao: 'Adicional do pedido',
              isBump: true,
              selected: true
            });
          }
        });
        localStorage.setItem('famosinhos_cart', JSON.stringify([mainItem]));
        localStorage.setItem('famosinhos_checkout_cart', JSON.stringify(allItems));
        localStorage.setItem('famosinhos_ultimo_produto_url', window.location.origin + '/');
      } catch (e) { }
    }

    function formatTimerSeconds(sec) {
      const s = Math.max(0, Math.floor(sec));
      return `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
    }

    function countdown() {
      return formatTimerSeconds((state.deadline - Date.now()) / 1000);
    }

    function rewardCountdown() {
      return formatTimerSeconds((state.rewardDeadline - Date.now()) / 1000);
    }

      const months = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];
      const d1 = new Date();
      d1.setDate(d1.getDate() + 3);
      const d2 = new Date();
      d2.setDate(d2.getDate() + 4);
      return `${d1.getDate()} de ${months[d1.getMonth()]} - ${d2.getDate()} de ${months[d2.getMonth()]}`;
    }

    function toast(message) {
      const el = document.getElementById('toast');
      if (!el) return;
      el.textContent = message;
      el.classList.add('show');

      toast.timer = setTimeout(() => el.classList.remove('show'), 2500);

    function syncUrlForView(view, push = true) {
      const qs = window.location.search || '';
      const targetPath = view === 'carrinho'
        ? '/tkk-pedido/oferta/carrinho.html'
        : view === 'checkout'
          ? '/tkk-pedido/oferta/checkout.html'
          : '/tkk-pedido/';
      const nextUrl = targetPath + qs;
      try {
        if (push) history.pushState({ view }, '', nextUrl);
        else history.replaceState({ view }, '', nextUrl);
      } catch (e) {
        location.hash = view === 'produto' ? '' : view;
      }
    }

    function buildTrackingItems() {
      const unitNow = effectiveUnitPrice();
      const list = [{
        id: PRODUCT_ID,
        nome: PRODUCT_NAME,
        preco: unitNow,
        qty: state.qty
      }];
      state.selected.forEach(id => {
        const b = BUMPS.find(x => x.id === id);
        if (b) {
          list.push({
            id: b.itemId,
            nome: b.name,
            preco: b.price,
            qty: 1
          });
        }
      });
      return list;
    }

    function fireViewEvent(view) {
      try {
        if (typeof window.clarity === 'function') {
          window.clarity('set', 'etapa_funil', view);
          window.clarity('event', 'funil_' + view);
        }
      } catch (eClarity) { }

      const run = () => {
        try {
          if (view === 'produto') {
            if (!window.__gtsVcSent && typeof window.ttqViewContent === 'function') {
              window.__gtsVcSent = true;
              window.ttqViewContent({ id: PRODUCT_ID, nome: PRODUCT_NAME, preco: effectiveUnitPrice(), qty: state.qty });
            }
          } else if (view === 'carrinho') {
            if (typeof window.ttqAddToCart === 'function') {
              window.ttqAddToCart({ id: PRODUCT_ID, nome: PRODUCT_NAME, preco: effectiveUnitPrice(), qty: state.qty }, state.qty);
            }
          } else if (view === 'checkout') {
            if (typeof window.ttqInitiateCheckout === 'function') {
              window.ttqInitiateCheckout(total(), buildTrackingItems());
            }
          }
        } catch (e) { }
      };
      if (typeof window.ttqViewContent === 'function') {
        run();
      } else {
        window.addEventListener('DOMContentLoaded', run, { once: true });
      }
    }

    function go(view, push = true) {
      if (state.view === 'checkout') syncFormFromDom();
      if (view === 'checkout') {
        state.cartBaseQty = state.qty;
      }
      if (state.reward) {
        state.reward = false;
        const rr = document.getElementById('reward-root');
        if (rr) { rr.classList.remove('is-open', 'is-closing'); }
      }
      state.view = view;
      persistCartSnapshot();
      syncUrlForView(view, push);
      fireViewEvent(view);
      render();
      if (secondaryHydrated) hydrateSecondaryDomImages();
      window.scrollTo(0, 0);
    }

    function startCoinCounterAnimation() {
      if (coinAnimFrame) cancelAnimationFrame(coinAnimFrame);
      const targetCoins = 1780;
      const duration = 4000;
      const startTs = performance.now();
      const step = now => {
        const progress = Math.min(1, (now - startTs) / duration);
        const eased = 1 - Math.pow(1 - progress, 3);
        const current = Math.round(targetCoins * eased);
        state.rewardCoins = current;
        const el = document.getElementById('reward-coins-val');
        if (el) el.textContent = current.toLocaleString('pt-BR');
        if (progress < 1 && state.reward) {
          coinAnimFrame = requestAnimationFrame(step);
        } else {
          coinAnimFrame = null;
        }
      };
      coinAnimFrame = requestAnimationFrame(step);
    }

    let rewardCloseTimer = null;
    function ensureRewardMounted() {
      const rr = document.getElementById('reward-root');
      if (!rr) return null;
      if (!rr.firstElementChild) {
        rr.innerHTML = rewardModal();
      } else {
        const prodImg = rr.querySelector('.reward-product');
        const variantImg = A + (state.variant === 'Branco' ? 'produto-2.webp' : 'produto-3.webp');
        if (prodImg && prodImg.getAttribute('src') !== variantImg) {
          prodImg.src = variantImg;
        }
      }
      return rr;
    }

    function openRewardSheet() {
      const rr = ensureRewardMounted();
      if (!rr) return;
      if (rewardCloseTimer) {
        clearTimeout(rewardCloseTimer);
        rewardCloseTimer = null;
      }
      state.rewardDeadline = Date.now() + 540 * 1000;
      try { sessionStorage.setItem('gts_reward_deadline', String(state.rewardDeadline)); } catch (e) { }
      state.reward = true;
      state.rewardCoins = 0;
      const coinsEl = document.getElementById('reward-coins-val');
      if (coinsEl) coinsEl.textContent = '0';
      const rwTimerEl = rr.querySelector('[data-reward-countdown]');
      if (rwTimerEl) rwTimerEl.textContent = rewardCountdown();
      rr.classList.remove('is-closing');
      rr.classList.add('is-open');
      startCoinCounterAnimation();
    }

    function closeReward() {
      if (coinAnimFrame) {
        cancelAnimationFrame(coinAnimFrame);
        coinAnimFrame = null;
      }
      state.reward = false;
      state.rewardSeen = true;
      try { sessionStorage.setItem('gts_reward_seen', '1'); } catch (e) { }
      const rr = document.getElementById('reward-root');
      if (!rr || !rr.classList.contains('is-open')) return;
      rr.classList.remove('is-open');
      rr.classList.add('is-closing');
      rewardCloseTimer = setTimeout(() => {
        rr.classList.remove('is-closing');
        rewardCloseTimer = null;
      }, 300);
    }

    function bindGalleryTouch() {
      const galEl = document.getElementById('product-gallery');
      if (!galEl) return;
      let startX = 0;
      let endX = 0;
      galEl.addEventListener('touchstart', e => {
        startX = e.touches[0].clientX;
        endX = startX;
      }, { passive: true });
      galEl.addEventListener('touchmove', e => {
        endX = e.touches[0].clientX;
      }, { passive: true });
      galEl.addEventListener('touchend', () => {
        const diff = startX - endX;
        const len = activeGallery().length;
        if (Math.abs(diff) > 50) {
          state.slide = diff > 0
            ? (state.slide + 1) % len
            : (state.slide + len - 1) % len;
          updateGalleryDomOnly();
        }
      }, { passive: true });

    function isValidCpf(rawCpf) {
      const cpf = String(rawCpf || '').replace(/\D/g, '');
      if (cpf.length !== 11 || /^(\d)\1{10}$/.test(cpf)) return false;
      let sum = 0;
      for (let i = 0; i < 9; i++) sum += parseInt(cpf.charAt(i), 10) * (10 - i);
      let rev = 11 - (sum % 11);
      if (rev === 10 || rev === 11) rev = 0;
      if (rev !== parseInt(cpf.charAt(9), 10)) return false;
      sum = 0;
      for (let i = 0; i < 10; i++) sum += parseInt(cpf.charAt(i), 10) * (11 - i);
      rev = 11 - (sum % 11);
      if (rev === 10 || rev === 11) rev = 0;
      return rev === parseInt(cpf.charAt(10), 10);
    }

    let lastLookedUpCep = '';
    async function lookupCep(digits) {
      if (digits.length !== 8 || digits === lastLookedUpCep) return;
      lastLookedUpCep = digits;
      state.cepLoading = true;
      try {
        const resp = await fetch(`https://viacep.com.br/ws/${digits}/json/`);
        if (resp.ok) {
          const data = await resp.json();
          if (data && !data.erro) {
            if (data.logradouro) state.form.rua = data.logradouro;
            if (data.bairro) state.form.bairro = data.bairro;
            if (data.localidade) state.form.cidade = data.localidade;
            if (data.uf) state.form.uf = data.uf;
            delete state.formErrors.cep;
            delete state.formErrors.cidade;
            delete state.formErrors.rua;
            delete state.formErrors.bairro;
            delete state.formErrors.uf;
            persistDraftToStorage();
            const formEl = document.getElementById('checkout-form');
            if (formEl) {
              if (data.logradouro && formEl.elements.rua) formEl.elements.rua.value = data.logradouro;
              if (data.bairro && formEl.elements.bairro) formEl.elements.bairro.value = data.bairro;
              if (data.localidade && formEl.elements.cidade) formEl.elements.cidade.value = data.localidade;
              if (data.uf && formEl.elements.uf) formEl.elements.uf.value = data.uf;
              const numInput = formEl.elements.numero;
              if (numInput && !numInput.value) numInput.focus();
            }
          }
        }
      } catch (e) {
      } finally {
        state.cepLoading = false;
      }
    }

      const lb = document.getElementById('review-lightbox');
      if (!lb) return;
      if (state.lightboxIdx === null || !FLAT_REVIEW_PHOTOS[state.lightboxIdx]) {
        lb.classList.remove('open');
        document.body.style.overflow = '';
        return;
      }
      const item = FLAT_REVIEW_PHOTOS[state.lightboxIdx];
      const img = document.getElementById('review-lightbox-img');
      const cnt = document.getElementById('lb-counter');
      const dots = document.getElementById('lb-dots');
      const av = document.getElementById('lb-avatar');
      const au = document.getElementById('lb-author');
      const tx = document.getElementById('lb-text');

      if (img) {
        img.src = item.src;
        img.alt = `Foto ${state.lightboxIdx + 1}`;
      }
      if (cnt) cnt.textContent = `${state.lightboxIdx + 1}/${FLAT_REVIEW_PHOTOS.length}`;
      if (dots) {
        dots.style.display = item.totalLocal > 1 ? 'flex' : 'none';
        dots.innerHTML = item.totalLocal > 1
          ? Array.from({ length: item.totalLocal }, (_, idx) => `<span class="${idx === item.localIdx ? 'active' : ''}"></span>`).join('')
          : '';
      }
      if (av) {
        const initChar = escapeHtml((item.review.customerName?.[0] || 'C').toUpperCase());
        if (item.review.avatar) {
          av.innerHTML = `<img src="${item.review.avatar}" alt="" style="width:100%;height:100%;object-fit:cover;border-radius:50%;display:block;" onerror="if(this.parentNode)this.parentNode.textContent='${initChar}'">`;
        } else {
          av.textContent = initChar;
        }
      }
      if (au) au.textContent = item.review.customerName || '';
      const lbMeta = lb.querySelector('.lb-caption-item');
      if (lbMeta) lbMeta.textContent = item.review.date || 'Item: Bicicleta elétrica 500W';
      if (tx) tx.textContent = String(item.review.comment || '').replace(/\n/g, ' ');
      lb.classList.add('open');
      document.body.style.overflow = 'hidden';
    }

    function openPhotoLightbox(idx) {
      state.lightboxIdx = Math.max(0, Math.min(FLAT_REVIEW_PHOTOS.length - 1, Number(idx) || 0));
      renderPhotoLightbox();
    }

    function closePhotoLightbox() {
      state.lightboxIdx = null;
      renderPhotoLightbox();
    }

    function stepPhotoLightbox(delta) {
      if (state.lightboxIdx === null || !FLAT_REVIEW_PHOTOS.length) return;
      state.lightboxIdx = (state.lightboxIdx + delta + FLAT_REVIEW_PHOTOS.length) % FLAT_REVIEW_PHOTOS.length;
      renderPhotoLightbox();
    }

    (function bindLightboxSwipeAndKeys() {
      const lb = document.getElementById('review-lightbox');
      if (!lb) return;
      let sx = 0;
      let ex = 0;
      lb.addEventListener('touchstart', e => {
        sx = e.touches[0].clientX;
        ex = sx;
      }, { passive: true });
      lb.addEventListener('touchmove', e => {
        ex = e.touches[0].clientX;
      }, { passive: true });
      lb.addEventListener('touchend', () => {
        const d = sx - ex;
        if (Math.abs(d) > 40) {
          stepPhotoLightbox(d > 0 ? 1 : -1);
        }
        sx = 0;
        ex = 0;
      }, { passive: true });
      window.addEventListener('keydown', e => {
        if (state.lightboxIdx === null) return;
        if (e.key === 'Escape') closePhotoLightbox();
        else if (e.key === 'ArrowRight') stepPhotoLightbox(1);
        else if (e.key === 'ArrowLeft') stepPhotoLightbox(-1);
      });
    })();

    function syncStickyProductTabs() {
      if (state.view !== 'produto') return;
      const nav = document.getElementById('product-sticky-tabs');
      if (!nav) return;
      const y = window.scrollY || window.pageYOffset || 0;
      nav.classList.toggle('tabs-visible', y > 180);

      const secRec = document.getElementById('sec-recomendacoes');
      const secDesc = document.getElementById('sec-descricao');
      const secRev = document.getElementById('sec-avaliacoes');
      const probeY = y + 125;
      let activeTarget = 'top';
      if (secRec && probeY >= secRec.offsetTop) activeTarget = 'sec-recomendacoes';
      else if (secDesc && probeY >= secDesc.offsetTop) activeTarget = 'sec-descricao';
      else if (secRev && probeY >= secRev.offsetTop) activeTarget = 'sec-avaliacoes';

      nav.querySelectorAll('.product-tab').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.target === activeTarget);
      });
    }
    window.addEventListener('scroll', syncStickyProductTabs, { passive: true });

    document.addEventListener('click', async e => {
      const photoBtn = e.target.closest('[data-photo-index]');
      if (photoBtn) {
        openPhotoLightbox(Number(photoBtn.dataset.photoIndex));
        return;
      }

      const target = e.target.closest('[data-action]');
      if (!target) return;
      const action = target.dataset.action;
      const galLen = activeGallery().length;

      if (action === 'lb-close') {
        closePhotoLightbox();
      } else if (action === 'lb-prev') {
        stepPhotoLightbox(-1);
      } else if (action === 'lb-next') {
        stepPhotoLightbox(1);
      } else if (action === 'open-protecao') {
        openProtecaoSheet();
      } else if (action === 'close-protecao') {
        closeProtecaoSheet();
      } else if (action === 'open-oficial') {
        openOficialSheet();
      } else if (action === 'close-oficial') {
        closeOficialSheet();
      } else if (action === 'scroll-variants') {
        const varEl = document.getElementById('sec-variants');
        if (varEl) varEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
      } else if (action === 'tab-scroll') {
        const tgt = target.dataset.target;
        if (tgt === 'top') {
          window.scrollTo({ top: 0, behavior: 'smooth' });
        } else {
          const sec = document.getElementById(tgt);
          if (sec) {
            const topPos = sec.getBoundingClientRect().top + window.pageYOffset - 92;
            window.scrollTo({ top: Math.max(0, topPos), behavior: 'smooth' });
          }
        }
      } else if (action === 'load-more-reviews') {
        state.reviewsShown = Math.min(ALL_REVIEWS.length, state.reviewsShown + 10);
        render();
        syncStickyProductTabs();
      } else if (action === 'prev') {
        state.slide = (state.slide + galLen - 1) % galLen;
        updateGalleryDomOnly();
      } else if (action === 'next') {
        state.slide = (state.slide + 1) % galLen;
        updateGalleryDomOnly();
      } else if (action === 'slide') {
        state.slide = Number(target.dataset.index);
        updateGalleryDomOnly();
      } else if (action === 'variant') {
        state.variant = target.dataset.variant;
        state.slide = 0;
        ensureRewardMounted();
        persistCartSnapshot();
        render();
        syncStickyProductTabs();
      } else if (action === 'close-reward') {
        closeReward();
      } else if (action === 'apply-reward') {
        state.rewardClaimed = true;
        try { sessionStorage.setItem('gts_reward_claimed', '1'); } catch (e) { }
        closeReward();
      } else if (action === 'coupon') {
        if (!state.couponApplied) {
          state.couponApplied = true;
          persistCartSnapshot();
          render();
          syncStickyProductTabs();
          showCouponBanner();
        }
      } else if (action === 'buy') {
        go('carrinho');
      } else if (action === 'cart') {
        go('carrinho');
      } else if (action === 'checkout') {
        go('checkout');
      } else if (action === 'product') {
        go('produto');
      } else if (action === 'plus') {
        if (state.view === 'checkout') syncFormFromDom();
        state.qty = Math.min(MAX_QTY, state.qty + 1);
        persistCartSnapshot();
        render();
      } else if (action === 'minus') {
        if (state.view === 'checkout') syncFormFromDom();
        state.qty = Math.max(1, state.qty - 1);
        persistCartSnapshot();
        render();
      } else if (action === 'top') {
        window.scrollTo({ top: 0, behavior: 'smooth' });
      } else if (action === 'share') {
        try {
          if (navigator.share) {
            await navigator.share({ title: PRODUCT_NAME, url: location.href });
          } else {
            await navigator.clipboard.writeText(location.href);
            toast('Link copiado');
          }
        } catch (err) { }
      } else if (action === 'store' || action === 'more') {
        window.location.href = '/tkk-pedido/loja' + (window.location.search || '');
      }
    });

    app.addEventListener('change', e => {
      if (e.target.matches('[data-bump]')) {
        const id = e.target.dataset.bump;
        if (e.target.checked) {
          if (state.selected.size < 3) state.selected.add(id);
        } else {
          state.selected.delete(id);
        }
        persistCartSnapshot();
        render();
        return;
      }
      if (e.target.form && e.target.form.id === 'checkout-form' && e.target.name) {
        state.form[e.target.name] = e.target.value;
        delete state.formErrors[e.target.name];
        persistDraftToStorage();
      }
    });

    app.addEventListener('input', e => {
      const field = e.target;
      if (!field || !field.name) return;

      if (field.name === 'cep') {
        const d = field.value.replace(/\D/g, '').slice(0, 8);
        field.value = d.length > 5 ? d.slice(0, 5) + '-' + d.slice(5) : d;
        state.form.cep = field.value;
        if (d.length === 8) lookupCep(d);
      } else if (field.name === 'uf') {
        field.value = field.value.replace(/[^a-zA-Z]/g, '').toUpperCase().slice(0, 2);
        state.form.uf = field.value;
      } else if (field.name === 'cpf') {
        const d = field.value.replace(/\D/g, '').slice(0, 11);
        field.value = d
          .replace(/^(\d{3})(\d)/, '$1.$2')
          .replace(/^(\d{3})\.(\d{3})(\d)/, '$1.$2.$3')
          .replace(/\.(\d{3})(\d)$/, '.$1-$2');
        state.form.cpf = field.value;
      } else if (field.name === 'telefone') {
        const d = field.value.replace(/\D/g, '').slice(0, 11);
        if (d.length > 10) {
          field.value = '(' + d.slice(0, 2) + ') ' + d.slice(2, 7) + '-' + d.slice(7);
        } else if (d.length > 6) {
          field.value = '(' + d.slice(0, 2) + ') ' + d.slice(2, 6) + '-' + d.slice(6);
        } else if (d.length > 2) {
          field.value = '(' + d.slice(0, 2) + ') ' + d.slice(2);
        } else {
          field.value = d;
        }
        state.form.telefone = field.value;
      } else {
        state.form[field.name] = field.value;
      }

      if (state.formErrors[field.name]) {
        delete state.formErrors[field.name];
        field.classList.remove('field-invalid');
      }
      persistDraftToStorage();
    });

    app.addEventListener('submit', e => {
      if (e.target.id !== 'checkout-form') return;
      e.preventDefault();
      if (state.submitting) return;

      syncFormFromDom();
      const f = state.form;
      const errors = {};

      const cepDigits = (f.cep || '').replace(/\D/g, '');
      const cpfDigits = (f.cpf || '').replace(/\D/g, '');
      const telDigits = (f.telefone || '').replace(/\D/g, '');
      const emailClean = (f.email || '').trim();
      const nomeClean = (f.nome || '').trim();
      const ufClean = (f.uf || '').trim().toUpperCase();

      if (cepDigits.length !== 8) errors.cep = 'Informe um CEP válido com 8 dígitos';
      if (!(f.cidade || '').trim()) errors.cidade = 'Informe a cidade';
      if (!(f.rua || '').trim()) errors.rua = 'Informe a rua';
      if (!(f.numero || '').trim()) errors.numero = 'Informe o número';
      if (!(f.bairro || '').trim()) errors.bairro = 'Informe o bairro';
      if (!UF_LIST.includes(ufClean)) errors.uf = 'Informe a UF (ex: SP)';

    function waitDomImg(imgEl) {
      if (!imgEl) return Promise.resolve();
      return new Promise(resolve => {
        let done = false;
        const finish = () => {
          if (done) return;
          done = true;
          resolve();
        };
        const decodeAndFinish = () => {
          if (typeof imgEl.decode === 'function') {
            imgEl.decode().then(finish).catch(finish);
          } else {
            finish();
          }
        };
        if (imgEl.complete && imgEl.naturalWidth > 0) {
          decodeAndFinish();
          return;
        }
        imgEl.addEventListener('load', decodeAndFinish, { once: true });
        imgEl.addEventListener('error', finish, { once: true });
      });
    }

    function hydrateSecondaryDomImages() {
      secondaryHydrated = true;
      document.querySelectorAll('img[data-defer-src]').forEach(img => {
        const realSrc = img.getAttribute('data-defer-src');
        if (realSrc) {
          img.src = realSrc;
          img.removeAttribute('data-defer-src');
        }
      });
    }

    function preloadSecondaryAssets() {
      hydrateSecondaryDomImages();
      const secondary = [
        A + 'produto-3.webp',
        ...BASE_IMAGES.filter(f => f !== 'produto-2.webp' && f !== 'produto-3.webp').map(f => A + f),
        ...BUMPS.map(b => b.image)
      ];
      secondary.forEach(src => {
        const im = new Image();
        im.decoding = 'async';
        im.src = src;
      });
    }

    (function initReferenceLoader() {
      const loader = document.getElementById('tiktok-loader');
      if (state.view !== 'produto') {
        hydrateSecondaryDomImages();
        if (loader) loader.classList.add('is-hidden');
        preloadSecondaryAssets();
        return;
      }

      // Monta os elementos reais do modal ocultos a 0ms para já baixar e decodificar na GPU junto com a página
      const rr = ensureRewardMounted();
      const domImgs = [
        document.getElementById('main-gallery-img'),
        ...(rr ? Array.from(rr.querySelectorAll('img')) : [])
      ];

      const criticalDomImgsReady = Promise.race([
        Promise.all(domImgs.map(waitDomImg)),
        new Promise(r => setTimeout(r, 8500))
      ]).then(() => {
        // Assim que a foto principal/modal decodificar 100%, hidrata as barras e miniaturas abaixo da dobra em background
        hydrateSecondaryDomImages();
      });

      // Ritmo calibrado com o site de referência (~2.6s totais desde a abertura) + 100% das imagens prontas
      const elapsedMs = (typeof performance !== 'undefined' && typeof performance.now === 'function')
        ? performance.now()
        : 0;
      const waitMs = state.rewardSeen
        ? 250
        : Math.max(1400, 2600 - elapsedMs);
      const minReferenceDelay = new Promise(r => setTimeout(r, waitMs));

      Promise.all([minReferenceDelay, criticalDomImgsReady]).then(() => {
        if (loader) {
          loader.classList.add('is-fading');
          setTimeout(() => loader.classList.add('is-hidden'), 220);
        }
        if (state.view === 'produto' && !state.rewardSeen && !state.rewardClaimed) {
          openRewardSheet();
        }
        (window.requestIdleCallback || function (cb) { setTimeout(cb, 350); })(preloadSecondaryAssets);
      });
    })();
